<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穎樂活動</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">NINA SCHEDULE</div>
      <h1>穎樂活動</h1>
    </div>
    <div class="socials">
      <a href="https://www.instagram.com/ninalin1231/" target="_blank" rel="noreferrer" class="igbtn">IG:ninalin1231</a>
      <a href="https://www.instagram.com/rakutengirls_nina/" target="_blank" rel="noreferrer" class="igbtn">IG:rakutengirls_nina</a>
      <a href="https://www.instagram.com/yinghaus_shop/" target="_blank" rel="noreferrer" class="igbtn">IG:yinghaus_shop</a>
    </div>
  </div>

  <div class="monthbar">
    <button class="navbtn" id="prev">‹</button>
    <div class="label" id="monthLabel"></div>
    <button class="navbtn" id="next">›</button>
    <button class="exportbtn" id="exportBtn">📋 複製場外活動</button>
  </div>

  <div class="weekdays">
    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>

</div>

<!-- 詳情票根 -->
<div class="overlay" id="overlay">
  <div class="ticket" id="ticket"></div>
</div>

<!-- 場外活動輸出 -->
<div class="overlay" id="exportOverlay">
  <div class="exportbox">
    <div class="exporthead">場外活動</div>
    <textarea id="exportText" readonly></textarea>
    <button class="mapbtn" id="copyBtn">複製文字</button>
    <button class="closebtn" id="exportClose">關閉</button>
  </div>
</div>

<script>
  // 動態載入 app.js 並加上時間戳，避免瀏覽器/GitHub Pages 快取到舊版
  (function(){
    var s=document.createElement("script");
    s.src="app.js?t="+Date.now();
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
